competition:
  title: 数字图像处理课程挑战赛
  subtitle: 图像去噪 · 图像去色
  timezone: Asia/Shanghai
  contest_code_prefix: S
  anonymous: true
  intro: >
    本次测试包含两个任务：图像去噪与图像去色。学生只需在本地运行自己的算法，
    将结果图像上传到本平台，服务器自动计算客观指标并更新排行榜；
    两个任务在截止后都会组织匿名两两比较的主观评价。
  rules:
    - 每个任务提供两张输入图像，需分别提交两张同尺寸结果图。
    - 去噪任务提交 8-bit RGB PNG（3 通道）；去色任务提交 8-bit 灰度 PNG（1 通道）。
    - 不允许改变图像尺寸、不做全局重新归一化、不改变文件格式，否则判定为无效提交。
    - 提交次数不限，截止前可反复上传覆盖；每张图任选一次提交「确认为最终作品」参与排名，
      默认选中该图排名指标（PSNR / E-score）最高的一次，确认后记录图像、文件名与提交时间。
    - 禁止直接使用他人结果或公开的参考图；去色任务不得直接复制 CADIK 主页上已有算法的结果。
    - 截止后作品冻结，进入匿名互评阶段；互评阶段不可再修改作品。
    - 互评采用两两比较，不显示作者、算法名与客观指标，左右位置随机；两个任务分别进行。
  data_note: >
    去噪任务的参考图来自 SIDD（Smartphone Image Denoising Dataset），
    去色任务图像来自 Čadík 等人在 2008 年公布的 color-to-gray 评测数据集。
    参考图像仅保存在服务器私有目录，不通过任何 URL 对普通用户开放。

schedule:
  submission_open: 2026-11-26T08:00:00
  submission_close: 2026-12-10T23:59:59
  review_open: 2026-12-11T08:00:00
  review_close: 2026-12-17T23:59:59

tasks:
  - slug: denoise
    name: 图像去噪
    short_name: 去噪
    icon: "01"
    tagline: 真实噪声与合成高斯噪声
    description: >
      两张含噪图像分别对应手机真实噪声与合成高斯噪声。请使用你实现的去噪算法
      （传统方法或深度学习方法均可）恢复干净图像，并上传与原图同尺寸的 RGB 结果。
    channels: 3
    color_mode: RGB
    file_format: PNG
    max_submissions: 0   # 0 = 不限提交次数
    ranking_metric: psnr
    tiebreak_metric: ssim
    review_hint: 评价依据：噪声残留是否明显、纹理与细节是否保留、边缘有没有被过度抹平、是否出现伪影或色偏。
    review_input_label: 含噪输入图
    review_result_label: 去噪结果
    images:
      - key: D01
        label: 图 1 · 真实噪声
        note: SIDD 手机真实噪声（sRGB）
      - key: D02
        label: 图 2 · 合成噪声
        note: 干净图像 + 高斯噪声 σ=25/255
    metrics:
      - key: psnr
        name: PSNR
        unit: dB
        digits: 2
        higher_better: true
        hint: 峰值信噪比，越高说明像素误差越小
      - key: ssim
        name: SSIM
        unit: ""
        digits: 4
        higher_better: true
        hint: 结构相似性，评价亮度、对比度与结构信息
    baseline_methods:
      - identity
      - gaussian
      - median
      - bilateral
      - nlm
      - bm3d

  - slug: decolor
    name: 图像去色
    short_name: 去色
    icon: "02"
    tagline: 彩色到灰度的对比度保持
    description: >
      去色没有唯一正确答案：好的算法要在压掉颜色的同时保留原图中可区分的颜色差异，
      又不能凭空制造对比度。请提交两张与输入同尺寸的 8-bit 灰度图，
      系统将计算 CCPR、CCFR 与 E-score，并在截止后组织匿名两两比较。
    channels: 1
    color_mode: L
    file_format: PNG
    max_submissions: 0   # 0 = 不限提交次数
    ranking_metric: escore
    tiebreak_metric: ccpr
    review_hint: 评价依据：原本可区分的颜色在灰度中是否仍能区分、细节是否保留、对比度是否合理、整体是否自然、有无明显伪影。
    review_input_label: 彩色原图
    review_result_label: 灰度结果
    images:
      - key: C01
        label: 图 1 · 图形与色块
        note: 人工图形，考察相近亮度颜色的可区分性
      - key: C02
        label: 图 2 · 自然场景
        note: 自然图像，考察细节、对比度与自然性
    metrics:
      - key: ccpr
        name: CCPR
        unit: ""
        digits: 4
        higher_better: true
        hint: 颜色对比度保持率，原图中可区分的颜色对在灰度中仍可区分
      - key: ccfr
        name: CCFR
        unit: ""
        digits: 4
        higher_better: true
        hint: 颜色内容保真率，抑制凭空制造的强对比与伪边缘
      - key: escore
        name: E-score
        unit: ""
        digits: 4
        higher_better: true
        hint: CCPR 与 CCFR 的调和平均
    baseline_methods:
      - rgb2gray
      - opencv_decolor
      - light_linear

metrics_options:
  # PSNR / SSIM
  data_range: 255
  ssim_win_size: 7
  # 去色指标：Lu, Xu & Jia (IJCV 2014) 定义中的 CIELab 距离阈值 τ
  decolor_tau: 5
  # 每像素随机采样对数（官方 MATLAB 代码为 10）
  decolor_pairs_per_pixel: 10
  decolor_seed: 20140101

peer_review:
  enabled: true
  comparisons_per_student: 10   # 默认份数，可被下面的 tasks 或教师面板覆盖
  allow_tie: true
  random_swap: true
  exclude_own_submission: true
  anonymous: true
  ranking_method: bradley_terry
  tie_weight: 0.5
  regularization: 1.0
  # 每个任务单独设置匿名互评；comparisons_per_student 表示每位学生在该任务上要评价的份数
  tasks:
    denoise:
      enabled: true
      comparisons_per_student: 8
    decolor:
      enabled: true
      comparisons_per_student: 10

scoring:
  # 去色综合分 Q = 100 * (w_obj * E_norm + w_subj * R)
  weight_objective: 0.4
  weight_subjective: 0.6
  # 综合主观分：把去噪、去色两张主观榜（各自 BT 拟合，均为 0–100）合成一个总分
  # 综合主观分 = w_denoise * 去噪主观分 + w_decolor * 去色主观分（两者自动归一化，填 1:1 即为等权平均）
  denoise_subjective_weight: 0.5
  decolor_subjective_weight: 0.5
