# Nginx 反向代理示例（若学校已有 Nginx）
# sudo cp deploy/nginx.conf /etc/nginx/sites-available/dip.conf
# sudo ln -s /etc/nginx/sites-available/dip.conf /etc/nginx/sites-enabled/
# sudo nginx -t && sudo systemctl reload nginx

upstream dip_web {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name dip.example.edu.cn;
    client_max_body_size 25m;

    location / {
        proxy_pass http://dip_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
